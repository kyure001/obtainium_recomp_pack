name: Vérifier les propositions
on:
  workflow_dispatch:
  push:
    paths: ["proposals.json", "scripts/check_proposals.py", ".github/workflows/proposals.yml"]
permissions:
  contents: write
concurrency:
  group: pack-repo-writes
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check_proposals.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROPOSALS.md
          git diff --cached --quiet || { git commit -m "Propositions vérifiées" && git pull --rebase && git push; }
